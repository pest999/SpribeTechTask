# Test Configuration Properties

# API Configuration
api.base.url=http://localhost:8082
api.timeout.seconds=30

# Test Execution
test.profile=postgresql
test.database.type=postgresql
test.parallel.enabled=true
test.parallel.thread.count=4

# Docker Configuration
test.docker.enabled=true
test.docker.compose.file=docker-compose.yml

# Simple logging for tests
test.logging.debug=false
test.logging.request.response=false

# Test Data
test.data.path=src/test/resources/testdata 