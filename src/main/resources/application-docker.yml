spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/stribe_db
    username: stribe_user
    password: stribe_pass
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  logging:
    level:
      com.playermanagement: DEBUG
      org.hibernate.SQL: DEBUG

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always 