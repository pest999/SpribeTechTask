# === PostgreSQL Profile (for testing) ===

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:flamingo_db}
spring.datasource.username=${DB_USERNAME:flamingo_user}
spring.datasource.password=${DB_PASSWORD:flamingo_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL data initialization
spring.sql.init.platform=postgresql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Simple logging for tests
spring.jpa.show-sql=false
logging.level.com.playermanagement=WARN 