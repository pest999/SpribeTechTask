# === PostgreSQL Profile (for development with PostgreSQL) ===

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stribe_db}
spring.datasource.username=${DB_USERNAME:stribe_user}
spring.datasource.password=${DB_PASSWORD:stribe_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL data initialization
spring.sql.init.platform=postgresql
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# SQL Logging for development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 console
spring.h2.console.enabled=false 