# === Test Profile (PostgreSQL) ===

# PostgreSQL Database for Testing
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:stribe_db}
spring.datasource.username=${DB_USERNAME:stribe_user}
spring.datasource.password=${DB_PASSWORD:stribe_pass}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# PostgreSQL data initialization
spring.sql.init.platform=postgresql
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Test environment SQL logging (minimal)
spring.jpa.show-sql=false 